services:
  bringup_gui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    container_name: gs_bringup_gui
    volumes:
      - ./bringup_gui:/gs/bringup_gui:ro
      - ./config/cyclonedds.xml:/etc/cyclonedds.xml:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
      - GS_IFACE=${GS_IFACE:-enp63s0}
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - PYTHONUNBUFFERED=1
    network_mode: host
    ipc: host
    command: python3 /gs/bringup_gui/bringup_gui.py
